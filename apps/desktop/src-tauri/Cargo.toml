[package]
name = "vast-desktop"
version = "0.1.0"
description = "Vast MongoDB workbench desktop shell"
authors = ["Vast"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "vast_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
