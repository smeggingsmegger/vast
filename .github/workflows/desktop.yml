# Build Vast desktop installers on each OS (Tauri cannot cross-compile reliably).
# Artifacts: upload per-platform bundles for release or manual download.
name: Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    paths:
      - 'apps/desktop/**'
      - 'apps/web/**'
      - 'apps/server/**'
      - 'packages/**'
      - 'scripts/desktop-*.sh'
      - '.github/workflows/desktop.yml'

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macOS
          - os: ubuntu-22.04
            platform: Linux
          - os: windows-latest
            platform: Windows

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Linux system deps (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Prepare web + packages
        shell: bash
        run: bash scripts/desktop-prepare.sh

      - name: Build Tauri
        shell: bash
        run: |
          pnpm --filter @vast/desktop install
          pnpm --filter @vast/desktop exec tauri build

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: vast-desktop-${{ matrix.platform }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/**
          if-no-files-found: warn
          retention-days: 14
