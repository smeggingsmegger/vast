name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  unit:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @vast/shared build
      - run: pnpm --filter @vast/mongo-core build
      - run: pnpm --filter @vast/server build
      - run: pnpm --filter @vast/web build
      - run: pnpm -r typecheck
      - run: pnpm test:unit
      - run: pnpm --filter @vast/server test

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @vast/shared build
      - run: pnpm --filter @vast/mongo-core build
      - run: pnpm --filter @vast/web build
      - run: pnpm --filter @vast/e2e exec playwright install --with-deps chromium
      - name: Run E2E
        env:
          CI: '1'
          VAST_RUNTIME: web
          VAST_AUTH_MODE: none
          VAST_SECRET_KEY: ci-secret
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 7

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: vast:ci
          cache-from: type:gha
          cache-to: type:gha,mode=max
